# Il dexing di Android (mergeExtDex) va in "Java heap space" con la memoria di default del daemon:
# le librerie Compose sono tante e vengono unite in un colpo solo.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Le librerie del progetto sono AndroidX (Compose, Lifecycle): senza questo AGP si ferma.
android.useAndroidX=true

# Moduli indipendenti fra loro: si compilano in parallelo.
org.gradle.parallel=true
org.gradle.caching=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
